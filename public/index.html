<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة مهرجان الكرازة المرقسية</title>
  <link rel="icon" href="/public/logo-left.png" type="image/png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Tahoma", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top right, rgba(37,99,235,.16), transparent 35%),
        radial-gradient(circle at bottom left, rgba(245,158,11,.18), transparent 35%),
        #f4f7fb;
    }
    .login-card {
      width: 100%;
      max-width: 460px;
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 26px;
      padding: 34px 26px;
      text-align: center;
      box-shadow: 0 22px 55px rgba(15,23,42,.13);
    }
    .logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .logos img {
      width: 82px;
      height: 82px;
      object-fit: contain;
    }
    h1 {
      margin: 0 0 10px;
      color: #102a43;
      font-size: clamp(1.45rem, 5vw, 2rem);
      line-height: 1.45;
    }
    .subtitle {
      color: #52616b;
      margin: 0 0 26px;
      font-size: 1rem;
      line-height: 1.8;
    }
    .actions {
      display: grid;
      gap: 13px;
    }
    .btn {
      display: block;
      width: 100%;
      text-decoration: none;
      border-radius: 16px;
      padding: 15px 18px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(15,23,42,.14);
    }
    .student { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .teacher { background: linear-gradient(135deg, #16a34a, #15803d); }
    .register { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .footer-note {
      margin-top: 22px;
      color: #7b8794;
      font-size: .88rem;
    }
    @media (max-width: 480px) {
      body { padding: 14px; }
      .login-card { padding: 28px 18px; border-radius: 22px; }
      .logos img { width: 68px; height: 68px; }
      .btn { padding: 14px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logos">
      <img src="/public/logo-left.png" alt="شعار المهرجان">
      <img src="/public/logo-right.png" alt="شعار الكنيسة">
    </div>

    <h1>منصة مهرجان الكرازة المرقسية</h1>
    <p class="subtitle">مرحباً بكم في منصة إدارة وتسجيل المهرجان</p>

    <div class="actions">
      <a class="btn student" href="/public/student-login.html">تسجيل دخول مخدوم</a>
      <a class="btn teacher" href="/public/teacher-login.html">تسجيل دخول خادم</a>
      <a class="btn register" href="/public/register.html">تسجيل جديد</a>
    </div>

    <div class="footer-note">خدمة الخدام والمخدومين في مكان واحد</div>
  </main>
</body>
</html>
