<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول - مهرجان حبة حنطة</title>
  <link rel="icon" href="/public/logo-left.png" type="image/png">
  <link rel="stylesheet" href="/public/styles.css">
</head>
<body class="login-portal-page">
  <main id="loginPortal" class="vue-login-portal" v-cloak>
    <section class="login-portal-card">
      <div class="portal-logos">
        <img src="/public/logo-left.png" alt="شعار المهرجان">
        <img src="/public/logo-right.png" alt="شعار الكنيسة">
      </div>

      <p class="portal-kicker">منصة إلكترونية حديثة</p>
      <h1>مهرجان حبة حنطة</h1>
      <p class="portal-subtitle">تسجيل الدخول وإدارة بيانات المخدومين والأنشطة والفرق بسهولة.</p>

      <div class="portal-actions">
        <a v-for="action in actions" :key="action.href" :href="action.href" class="portal-btn" :class="action.kind">
          <span>{{ action.icon }}</span>
          <strong>{{ action.title }}</strong>
          <small>{{ action.text }}</small>
        </a>
      </div>

      <p class="portal-note">واجهة مبنية باستخدام Vue لتحسين تجربة المستخدم مع تصميم متجاوب للموبايل.</p>
    </section>
  </main>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    Vue.createApp({
      data() {
        return {
          actions: [
            { title: 'تسجيل دخول مخدوم', text: 'ادخل لكشف بياناتك وأنشطتك', href: '/public/student-login.html', icon: '👤', kind: 'student' },
            { title: 'تسجيل دخول خادم', text: 'متابعة المخدومين والفرق', href: '/public/teacher-login.html', icon: '🧑‍🏫', kind: 'teacher' },
            { title: 'تسجيل جديد', text: 'إنشاء حساب مخدوم جديد', href: '/public/register.html', icon: '➕', kind: 'register' }
          ]
        };
      }
    }).mount('#loginPortal');
  </script>
</body>
</html>
