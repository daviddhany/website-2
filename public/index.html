<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهرجان الكرازة المرقسية</title>
<link rel="stylesheet" href="styles.css">
<style>
body{margin:0;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f4f6f9}
.login-card{background:#fff;padding:40px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.12);width:90%;max-width:500px;text-align:center}
.logo{max-width:120px;margin-bottom:15px}
h1{margin-bottom:10px}
p{color:#666;margin-bottom:25px}
.btn{display:block;text-decoration:none;padding:15px;margin:12px 0;border-radius:12px;font-weight:bold}
.student{background:#2563eb;color:#fff}
.teacher{background:#16a34a;color:#fff}
.register{background:#f59e0b;color:#fff}
</style>
</head>
<body>
<div class="login-card">
<img src="logo-left.png" class="logo">
<h1>مهرجان الكرازة المرقسية</h1>
<p>مرحباً بكم في منصة إدارة وتسجيل المهرجان</p>
<a class="btn student" href="/student-login.html">تسجيل دخول مخدوم</a>
<a class="btn teacher" href="/teacher-login.html">تسجيل دخول خادم</a>
<a class="btn register" href="/register.html">تسجيل جديد</a>
</div>
</body>
</html>
